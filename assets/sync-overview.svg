<svg xmlns="http://www.w3.org/2000/svg" width="960" height="272" viewBox="0 0 960 272" role="img" aria-labelledby="title desc">
  <title id="title">BookReader 跨端阅读示意</title>
  <desc id="desc">Windows Desktop 和 iPhone PWA 各自保存本地书库，可选择通过 OneDrive 同步。同步不保证实时完成。</desc>
  <rect width="960" height="272" rx="22" fill="#171e28"/>
  <rect x="1" y="1" width="958" height="270" rx="21" fill="none" stroke="#344251" stroke-width="2"/>
  <text x="480" y="51" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#f2f5f7">先在本地阅读，再按需同步</text>
  <text x="480" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" letter-spacing="2" fill="#9aabb9">LOCAL FIRST · OPTIONAL SYNC</text>
  <path d="M290 166h61m258 0h61" stroke="#54a7df" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8"/>
  <path d="m301 156-11 10 11 10m39-20 11 10-11 10m280-20-11 10 11 10m39-20 11 10-11 10" fill="none" stroke="#54a7df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="40" y="111" width="250" height="111" rx="16" fill="#222d3a" stroke="#435468" stroke-width="2"/>
  <rect x="355" y="111" width="250" height="111" rx="16" fill="#1d3349" stroke="#3c86be" stroke-width="2"/>
  <rect x="670" y="111" width="250" height="111" rx="16" fill="#222d3a" stroke="#435468" stroke-width="2"/>
  <rect x="66" y="139" width="42" height="31" rx="3" fill="none" stroke="#c8d4df" stroke-width="3"/>
  <path d="M74 178h26m-13-8v8" stroke="#c8d4df" stroke-width="3" stroke-linecap="round"/>
  <text x="126" y="158" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#f2f5f7">Windows</text>
  <text x="126" y="188" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" fill="#afc0ce">本地书库</text>
  <path d="M386 168c-8 0-14-6-14-14s6-14 14-14c4-11 14-18 26-18 13 0 24 9 27 21 8-1 16 6 16 15 0 9-7 16-16 16h-53" fill="none" stroke="#69b6ec" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="471" y="158" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#f2f5f7">OneDrive</text>
  <text x="471" y="188" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" fill="#b9d8ee">可选同步</text>
  <rect x="699" y="133" width="31" height="53" rx="6" fill="none" stroke="#c8d4df" stroke-width="3"/>
  <path d="M711 178h7" stroke="#c8d4df" stroke-width="3" stroke-linecap="round"/>
  <text x="750" y="158" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#f2f5f7">iPhone PWA</text>
  <text x="750" y="188" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" fill="#afc0ce">本地阅读</text>
  <text x="480" y="250" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#9aabb9">离线照常阅读 · 同步可能延迟 · 并发修改需确认</text>
